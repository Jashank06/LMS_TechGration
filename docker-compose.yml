services:
  mongodb:
    image: mongo:7
    container_name: techgration-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  mailpit:
    image: axllent/mailpit:latest
    container_name: techgration-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techgration-lms-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - mongodb

volumes:
  mongodata:
